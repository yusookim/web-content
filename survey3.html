<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>설문지</title>
        <style>
            body {
                background-color: aliceblue;
                font-family: "휴먼편지체", "Malgun Gothic", cursive;
                color: black;
            }

            h1 {
                color: brown;
                text-align: center;
                font-family: "Malgun Gothic", sans-serif;
            }

            header p {
                line-height: 1.5;
            }

            hr {
                border: 0;
                border-top: 1px solid gray;
            }

            form {
                background-color: pink;
                margin: 16px 8px;
                padding: 2px 18px 0;
            }

            article {
                margin-bottom: 18px;
            }

            label {
                margin-right: 8px;
            }

            select {
                width: 175px;
                height: 22px;
                font-family: "Malgun Gothic", sans-serif;
            }

            textarea {
                width: 365px;
                height: 150px;
                vertical-align: middle;
                font-family: "Malgun Gothic", sans-serif;
            }

            footer {
                background-color: orange;
                border-radius: 10px;
                padding: 6px 12px;
                margin-top: 14px;
            }

            footer p {
                margin: 0;
                font-style: italic;
            }
        </style>
    </head>

    <body>
        <header>
            <h1>설문지</h1>
            <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
            <hr>
            <hr>
        </header>

        <section>
            <form>
                <article id="hagnyeon">
                    학년
                    <label><input type="radio" name="hagnyeon" value="1" checked>1학년</label>
                    <label><input type="radio" name="hagnyeon" value="2">2학년</label>
                    <label><input type="radio" name="hagnyeon" value="3">3학년</label>
                </article>

                <article id="seongbyeol">
                    성별
                    <label><input type="radio" name="seongbyeol" value="1">남</label>
                    <label><input type="radio" name="seongbyeol" value="2">여</label>
                </article>

                <article>
                    관심 분야
                    <select name="gwansim">
                        <option value="mobile" selected>모바일 소프트웨어</option>
                        <option value="game">게임</option>
                        <option value="finance">재테크</option>
                        <option value="ai">인공지능</option>
                        <option value="computer">컴퓨터</option>
                    </select>
                </article>

                <article>
                    진로
                    <label><input type="checkbox" value="1" checked>개발</label>
                    <label><input type="checkbox" value="2">기획</label>
                    <label><input type="checkbox" value="3">영업</label>
                    <label><input type="checkbox" value="4">창업</label>
                </article>

                <article>
                    남기고 싶은 말
                    <textarea cols="30" rows="10" placeholder="글을 남겨주세요"></textarea>
                </article>
            </form>
        </section>

        <footer>
            <p>Copyright 2026 by MYONGJI COLLEGE</p>
        </footer>
    </body>
</html>
